name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Lint workflows
        uses: docker://rhysd/actionlint:latest
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: olah-docker:test
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
      - name: Smoke test
        run: scripts/smoke-test.sh olah-docker:test
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: olah-docker:test
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Trivy scan (gate on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: olah-docker:test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
